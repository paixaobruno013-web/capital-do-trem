<!doctype html>
<html lang="pt-BR" data-offline-fallback="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Sem conexão — Capital do Trem</title>
<style>
:root{color-scheme:dark;--bg:#050505;--panel:#121212;--fg:#fff;--muted:#b8b8b8;--red:#ed1c24;--line:#333}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0%,#351012 0%,var(--bg) 58%);color:var(--fg);font:16px/1.55 system-ui,Arial,sans-serif}
main{width:min(100%,480px);padding:30px 24px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 60px #0009}
.brand{font-weight:900;letter-spacing:.12em;color:var(--muted);font-size:.82rem}
.symbol{width:116px;height:116px;margin:18px auto 22px;display:grid;place-items:center;border:0;border-radius:0}.symbol svg{display:block;width:116px;height:116px;filter:drop-shadow(0 5px 12px #ed1c2455)}
h1{margin:8px 0 12px;font-size:clamp(25px,7vw,34px);line-height:1.15}
p{color:var(--muted)}
.actions{display:grid;gap:11px;margin-top:24px}
a,button{min-height:48px;display:flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid var(--red);border-radius:11px;background:var(--red);color:#fff;font:700 15px system-ui,Arial,sans-serif;text-decoration:none;cursor:pointer}
a.secondary{background:transparent;border-color:var(--line)}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
#connection{min-height:1.5em;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="brand">⚠️ ALERTA • CAPITAL DO TREM</div>
<div class="symbol" aria-hidden="true"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 5 96 91H4L50 5Z" fill="#16090a" stroke="#ed1c24" stroke-width="4" stroke-linejoin="round"/><g stroke="#fff" stroke-linejoin="round"><path d="M31 57V25q0-8 8-8h22q8 0 8 8v32l-7 9H38z" fill="#e9e9e9" stroke-width="2.4"/><path d="M36 27q0-4 5-4h18q5 0 5 4v15H36z" fill="#171717" stroke-width="2"/><path d="M41 27h18v11H41z" fill="#9ec9d8" stroke="none"/><path d="M24 58h13v12H24zm39 0h13v12H63z" fill="#ed1c24" stroke-width="2"/><path d="M30 53h40v7H30zM38 66h24l6 8H32z" fill="#ed1c24" stroke-width="2"/><path d="M43 44h14v10H43z" fill="#303030" stroke-width="2"/><path d="M47 46h6v6h-6z" fill="#f4d36b" stroke="none"/><path d="M35 79h30" fill="none" stroke="#fff" stroke-width="3"/><path d="M40 12h20l-4-7H44z" fill="#ed1c24" stroke-width="2"/></g><circle cx="30" cy="63" r="3" fill="#fff"/><circle cx="70" cy="63" r="3" fill="#fff"/></svg></div>
<h1>VOCÊ TÁ OFFLINE</h1>
<p>A conexão caiu. O alerta ficará na tela por 13 segundos. Depois, abra sua playlist salva neste aparelho para continuar ouvindo músicas offline.</p>
<p id="connection" role="status" aria-live="polite">Aguardando conexão com a internet.</p>
<div class="actions">
<button id="retry" type="button">Tentar novamente</button>
<a class="secondary" href="./">Voltar ao início</a>
</div>
</main>
<script>
const status=document.getElementById('connection');
function update(){status.textContent=navigator.onLine?'Conexão restabelecida! Você já pode voltar ao aplicativo.':'ALERTA — VOCÊ TÁ OFFLINE. A playlist salva neste aparelho continua disponível.';}
window.addEventListener('online',()=>{update();try{navigator.vibrate?.(0);}catch{};});window.addEventListener('offline',update);
document.getElementById('retry').addEventListener('click',()=>{status.textContent='Tentando carregar novamente…';location.reload();});
update();try{if(!navigator.onLine&&navigator.vibrate)navigator.vibrate([1200,400,1200,400,1200,400,1200,400,1200,400,1200,400,1200,400,1200]);}catch{}
</script>
<script src="./update.js" defer></script></body>
</html>
