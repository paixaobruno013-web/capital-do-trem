name: Verificar preparação do aplicativo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preparar-versao-web:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Preparar arquivos do aplicativo
        run: npm run build:web
      - name: Conferir arquivos e ícones do PWA
        run: node scripts/check-pwa.mjs
      - name: Verificar sintaxe do módulo Supabase
        run: node --input-type=module --check < supabase/auth.js
      - name: Verificar sintaxe dos scripts das páginas
        run: node scripts/check-inline-scripts.mjs
      - name: Conferir proteção de envio de músicas
        run: |
          grep -q 'create policy "songs_insert_admin_only"' supabase/schema.sql
          grep -q 'create policy "audio_upload_admin_only"' supabase/schema.sql
          grep -q 'create policy "songs_insert_admin_only"' supabase/migrations/2026-11-06-admin-only-song-uploads.sql
          grep -q 'create policy "audio_upload_admin_only"' supabase/migrations/2026-11-06-admin-only-song-uploads.sql
          grep -q 'create policy "songs_insert_admin_only"' supabase/migrations/2026-11-08-harden-music-upload-permissions.sql
          grep -q 'create policy "audio_upload_admin_only"' supabase/migrations/2026-11-08-harden-music-upload-permissions.sql
          grep -q 'create or replace function private.is_admin()' supabase/schema.sql
          grep -q 'create or replace function private.bootstrap_first_admin()' supabase/schema.sql
          grep -Fq 'as $func          grep -q 'create or replace function private.is_admin()' supabase/migrations/2026-11-08-isolate-admin-security-functions.sql
          grep -q 'security invoker' supabase/schema.sql
          grep -q 'security invoker' supabase/migrations/2026-11-08-isolate-admin-security-functions.sql
          if grep -A5 'create or replace function public.is_admin()' supabase/schema.sql | grep -q 'security definer'; then
            echo "ERRO: função administrativa SECURITY DEFINER exposta no schema público."
            exit 1
          fi
          if grep -q 'create policy "songs_insert_own_pending"' supabase/schema.sql; then
            echo "ERRO: política antiga permite envio sem checagem de administrador."
            exit 1
          fi
          echo "Proteção de envio administrativo encontrada no schema e na migração."
          grep -q "values ('capital-do-trem-audio','capital-do-trem-audio',false" supabase/schema.sql
          grep -q "'capital-do-trem-media'" supabase/schema.sql
          grep -q 'create policy "audio_read_published_owner_admin"' supabase/schema.sql
          grep -q 'create policy "media_public_read"' supabase/schema.sql
          grep -q 'create policy "media_upload_own_folder"' supabase/schema.sql
          grep -q 'create policy "media_delete_own_or_admin"' supabase/schema.sql
          grep -q "Remover esta mensagem do bate-papo" admin.html
          echo "Buckets de áudio privado e mídia pública, com políticas de acesso, encontrados."
      - name: Conferir isolamento dos perfis
        run: |
          grep -q 'create policy "profile_read_own"' supabase/schema.sql
          grep -q 'create policy "profile_insert_own"' supabase/schema.sql
          grep -q 'create policy "profile_update_own"' supabase/schema.sql
          grep -q 'create policy "profiles_read_public"' supabase/schema.sql
          grep -q 'create policy "artists_update_own_or_admin"' supabase/schema.sql
          grep -q 'create or replace function public.protect_profile_account_type' supabase/schema.sql
          grep -q "new.raw_user_meta_data ->> 'account_type' = 'artist'" supabase/schema.sql
          grep -q 'profiles_protect_account_type' supabase/schema.sql
          test -s supabase/migrations/2026-11-08-artist-account-type.sql
          echo "Políticas de perfil, escolha de categoria Artista e proteção administrativa encontradas."
      - name: Conferir arquivos essenciais
        run: |
          test -s www/index.html
          test -s www/conta.html
          test -s www/admin.html
          test -s www/privacidade.html
          grep -q 'Supabase Auth' privacidade.html
          if grep -q 'Esta versão ainda não oferece cadastro' privacidade.html; then
            echo "ERRO: política de privacidade contém informação desatualizada sobre cadastro."
            exit 1
          fi
          test -s www/bate-papo.html
          test -s www/diagnostico.html
          test -s www/supabase/auth.js
          test -s supabase/schema.sql
          test -s supabase/migrations/2026-11-06-music-catalog.sql
          test -s www/manifest.webmanifest
          echo "Preparação web concluída: arquivos essenciais encontrados."
 supabase/schema.sql
          grep -q 'revoke execute on function public.is_admin() from anon' supabase/schema.sql
          if grep -Eq '^as \$|^\$;' supabase/schema.sql; then
            echo "ERRO: dollar quoting SQL incompleto."
            exit 1
          fi
          grep -q 'create or replace function private.is_admin()' supabase/migrations/2026-11-08-isolate-admin-security-functions.sql
