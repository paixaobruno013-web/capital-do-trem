name: Verificar preparação do aplicativo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  preparar-versao-web:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Preparar arquivos do aplicativo
        run: npm run build:web
      - name: Conferir arquivos e ícones do PWA
        run: node scripts/check-pwa.mjs
      - name: Verificar sintaxe dos módulos de Stories
        run: |
          python3 -m py_compile scripts/configure-android-media.py scripts/prepare-ios-info.py
          node --check stories-ui.js
          node --check home-story-composer.js
          node --check admin-stories.js
          node --check account-stories.js
      - name: Verificar fluxos prioritários de publicação
        run: |
          node --check home-story-composer.js
          node --check event-social-composer.js
          node --check scripts/check-creator-publishing.mjs
          node scripts/check-creator-publishing.mjs
      - name: Verificar sintaxe do módulo Supabase
        run: node --input-type=module --check < supabase/auth.js
      - name: Verificar sintaxe e presença do gravador de áudio do chat
        run: |
          node --check chat-enhancements.js
          test -s www/chat-enhancements.js
          grep -q 'audio/x-m4a' supabase/auth.js
      - name: Verificar sintaxe dos scripts das páginas
        run: node scripts/check-inline-scripts.mjs
      - name: Verificar coleção de publicações salvas e atualização do YouTube
        run: |
          node --check youtube-feed.js
          node scripts/check-social-saved-youtube.mjs
          test -s www/youtube-feed.js
      - name: Verificar curtidas e comentários do mural
        run: |
          node --check scripts/check-post-social.mjs
          node scripts/check-post-social.mjs
      - name: Verificar controles e regressões do chat
        run: node scripts/check-chat-controls.mjs
      - name: Verificar anexos seguros e envio moderno do chat
        run: |
          node --check scripts/check-chat-attachments.mjs
          node scripts/check-chat-attachments.mjs
      - name: Verificar abertura e fallback do vídeo
        run: |
          node --check scripts/check-intro-opening.mjs
          node scripts/check-intro-opening.mjs
      - name: Conferir proteção e segurança do banco
        run: |
          grep -q 'create policy "songs_insert_artist_pending_or_admin"' supabase/schema.sql
          grep -q 'create policy "audio_upload_artist_own_folder_or_admin"' supabase/schema.sql
          grep -q 'producer_name text not null default' supabase/schema.sql
          grep -q 'video/quicktime' supabase/schema.sql
          grep -q "video/quicktime':'mov'" supabase/auth.js
          grep -q 'android.permission.CAMERA' scripts/configure-android-media.py
          grep -q 'NSCameraUsageDescription' scripts/prepare-ios-info.py
          test -s supabase/migrations/20261111174500_allow_quicktime_story_media.sql
          if grep -q 'create policy "songs_insert_artist_or_admin"' supabase/schema.sql; then echo 'ERRO: política antiga de músicas continua ativa no schema.'; exit 1; fi
          if grep -q 'create policy "audio_upload_artist_or_admin"' supabase/schema.sql; then echo 'ERRO: política antiga de Storage continua ativa no schema.'; exit 1; fi
          if grep -q 'create policy "songs_insert_registered_users"' supabase/schema.sql; then
            echo "ERRO: usuários comuns ainda podem inserir músicas."
            exit 1
          fi
          if grep -q 'create policy "audio_upload_registered_users"' supabase/schema.sql; then
            echo "ERRO: usuários comuns ainda podem enviar arquivos musicais."
            exit 1
          fi
          grep -q 'create policy "songs_insert_admin_only"' supabase/migrations/2026-11-08-harden-music-upload-permissions.sql
          grep -q 'create policy "audio_upload_admin_only"' supabase/migrations/2026-11-08-harden-music-upload-permissions.sql
          grep -q 'create or replace function private.is_artist()' supabase/migrations/20261109191500_allow_artist_song_uploads.sql
          grep -q 'create policy "songs_insert_artist_or_admin"' supabase/migrations/20261109191500_allow_artist_song_uploads.sql
          grep -q 'create policy "audio_upload_artist_or_admin"' supabase/migrations/20261109191500_allow_artist_song_uploads.sql
          grep -q 'isCurrentUserArtistOrAdmin' supabase/auth.js
          grep -q 'create or replace function private.is_admin()' supabase/schema.sql
          grep -q 'revoke all privileges on all tables in schema public from anon, authenticated' supabase/schema.sql
          grep -q 'grant select on public.artists, public.events, public.posts, public.profiles, public.site_settings, public.songs to anon' supabase/schema.sql
          grep -q 'revoke all privileges on all tables in schema public from anon, authenticated' supabase/migrations/2026-11-08-minimize-public-api-table-privileges.sql
          grep -q 'create or replace function private.bootstrap_first_admin()' supabase/schema.sql
          grep -Fq 'as $func$' supabase/schema.sql
          grep -q 'revoke execute on function public.is_admin() from anon' supabase/schema.sql
          grep -q 'create or replace function private.is_admin()' supabase/migrations/2026-11-08-isolate-admin-security-functions.sql
          grep -q 'security invoker' supabase/schema.sql
          grep -q 'security invoker' supabase/migrations/2026-11-08-isolate-admin-security-functions.sql
          if grep -A5 'create or replace function public.is_admin()' supabase/schema.sql | grep -q 'security definer'; then
            echo "ERRO: função administrativa SECURITY DEFINER exposta no schema público."
            exit 1
          fi
          if grep -q 'create policy "songs_insert_own_pending"' supabase/schema.sql; then
            echo "ERRO: política antiga permite envio sem checagem de administrador."
            exit 1
          fi
          grep -q "values ('capital-do-trem-audio','capital-do-trem-audio',false" supabase/schema.sql
          grep -q "'capital-do-trem-media'" supabase/schema.sql
          grep -q 'create policy "audio_read_published_owner_admin"' supabase/schema.sql
          grep -q 'create policy "media_public_read"' supabase/schema.sql
          grep -q 'create policy "media_upload_own_folder"' supabase/schema.sql
          grep -q 'create policy "media_delete_own_or_admin"' supabase/schema.sql
          grep -q "Remover esta mensagem do bate-papo" admin.html
          echo "Proteção administrativa, políticas de upload e funções privadas verificadas."
      - name: Conferir isolamento dos perfis
        run: |
          grep -q 'create policy "profiles_read_public"' supabase/schema.sql
          grep -q 'is_public = true or user_id = (select auth.uid())' supabase/schema.sql
          grep -q 'create policy "profile_insert_own"' supabase/schema.sql
          grep -q 'create policy "profile_update_own"' supabase/schema.sql
          grep -q 'avatar_type text not null default' supabase/schema.sql
          grep -q 'author_avatar_type text not null default' supabase/schema.sql
          grep -q 'create or replace function public.set_community_author_name()' supabase/schema.sql
          grep -q 'create policy "artists_update_own_or_admin"' supabase/schema.sql
          grep -q 'create or replace function public.protect_profile_account_type' supabase/schema.sql
          grep -q "new.raw_user_meta_data ->> 'account_type' = 'artist'" supabase/schema.sql
          grep -q 'profiles_protect_account_type' supabase/schema.sql
          test -s supabase/migrations/2026-11-08-artist-account-type.sql
          test -s supabase/migrations/2026-11-08-optimize-profile-and-settings-policies.sql
          test -s supabase/migrations/2026-11-08-sync-profile-avatars-to-chat-messages.sql
          test -s supabase/migrations/2026-11-08-require-confirmed-owner-email-for-admin-bootstrap.sql
          grep -q "lower(coalesce(u.email, '')) = 'capitaldotrem07@gmail.com'" supabase/schema.sql
          grep -q 'u.email_confirmed_at is not null' supabase/schema.sql
          grep -q 'create table if not exists public.site_settings' supabase/schema.sql
          grep -q 'create policy "site_settings_admin_update"' supabase/schema.sql
          grep -q 'export async function saveMyAvatar' supabase/auth.js
          grep -q 'author_avatar_url' supabase/auth.js
          grep -q 'create table if not exists public.private_conversations' supabase/schema.sql
          grep -q 'create table if not exists public.private_messages' supabase/schema.sql
          grep -q 'private_messages_insert_accepted_participants' supabase/schema.sql
          grep -q 'private.private_users_blocked' supabase/schema.sql
          grep -q 'private_conversations_update_participants' supabase/schema.sql
          grep -q 'private.protect_private_conversation_update' supabase/schema.sql
          test -s supabase/migrations/2026-11-08-private-conversations.sql
          grep -q 'export async function sendPrivateMessage' supabase/auth.js
          grep -q 'subscribePrivateMessages' mensagens.html
          grep -q 'author_avatar_type' bate-papo.html
          echo "Políticas de perfil, configurações e avatar sincronizado verificadas."
      - name: Verificar monitoramento local de falhas
        run: node scripts/check-health-monitor.mjs
      - name: Verificar área de apoiadores
        run: node scripts/check-supporters.mjs
      - name: Verificar fluxo de exclusão de conta
        run: node scripts/check-account-deletion.mjs
      - name: Verificar biblioteca musical sincronizada
        run: node scripts/check-music-library.mjs
      - name: Verificar álbum privado do administrador
        run: node scripts/check-private-admin-gallery.mjs
      - name: Verificar Stories no perfil do usuário
        run: node scripts/check-account-stories.mjs
      - name: Conferir arquivos essenciais
        run: |
          test -s www/index.html
          test -s www/home-story-composer.js
          grep -q 'id="home-story-add"' www/index.html
          grep -q 'id="home-story-album-button"' www/index.html
          grep -q 'id="artist-song-submit-form"' www/conta.html
          test -s www/conta.html
          test -s www/admin.html
          test -s www/privacidade.html
          test -s www/account-deletion.html
          grep -q 'Supabase Auth' privacidade.html
          if grep -q 'Esta versão ainda não oferece cadastro' privacidade.html; then
            echo "ERRO: política de privacidade contém informação desatualizada sobre cadastro."
            exit 1
          fi
          test -s www/bate-papo.html
          test -s www/mensagens.html
          test -s www/diagnostico.html
          test -s www/supabase/auth.js
          test -s supabase/schema.sql
          test -s supabase/migrations/2026-11-06-music-catalog.sql
          test -s supabase/migrations/20261111173000_artist_song_submissions_with_producer.sql
          test -s supabase/migrations/20261111173500_retire_legacy_artist_song_upload_policies.sql
          test -s www/manifest.webmanifest
          echo "Preparação web concluída: arquivos essenciais encontrados."
