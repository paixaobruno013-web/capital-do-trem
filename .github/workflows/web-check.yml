          grep -q 'create or replace function public.protect_profile_account_type' supabase/schema.sql
          grep -q "new.raw_user_meta_data ->> 'account_type' = 'artist'" supabase/schema.sql
          grep -q 'profiles_protect_account_type' supabase/schema.sql
          test -s supabase/migrations/2026-11-08-artist-account-type.sql
          echo "Políticas de perfil, escolha de categoria Artista e proteção administrativa encontradas."
      - name: Conferir arquivos essenciais
        run: |
          test -s www/index.html
