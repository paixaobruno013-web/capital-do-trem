name: Preparar Android — APK direto e Google Play

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Gerar APK direto e AAB da Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
      APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
      APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
      APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_STORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Validar presença das credenciais sem exibi-las
        shell: bash
        run: |
          set -euo pipefail
          for name in APP_KEYSTORE_BASE64 APP_STORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta configurar um segredo protegido relacionado à assinatura Android."
              exit 1
            fi
          done

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar aplicativo e projeto Android
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android

      - name: Preparar ícones com a imagem oficial do perfil
        env:
          PROFILE_ICON_URL: https://zmjxkfjzrbbxyvgkwirv.supabase.co/storage/v1/object/public/capital-do-trem-media/31937786-c321-445f-ae1c-de018eca95c8/avatar/b338f7a8-8964-4063-9086-64a9bd603f4f.jpg
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$PROFILE_ICON_URL" --output /tmp/capital-do-trem-profile.jpg
          python -m pip install --quiet Pillow
          python scripts/prepare-app-icons.py /tmp/capital-do-trem-profile.jpg assets
          npx --yes @capacitor/assets@3.0.0 generate --android --assetPath assets --iconBackgroundColor '#080809' --iconBackgroundColorDark '#080809'

      - name: Sincronizar Capacitor e preparar mídia
        run: |
          npx cap sync android
          python3 scripts/configure-android-media.py android

      - name: Restaurar chaves protegidas em diretório temporário
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/capital-do-trem-app-signing.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/capital-do-trem-play-upload.jks"
          test -s "$RUNNER_TEMP/capital-do-trem-app-signing.jks"
          test -s "$RUNNER_TEMP/capital-do-trem-play-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/capital-do-trem-app-signing.jks" -storepass "$APP_STORE_PASSWORD" -alias "$APP_KEY_ALIAS" >/dev/null
          keytool -list -keystore "$RUNNER_TEMP/capital-do-trem-play-upload.jks" -storepass "$UPLOAD_STORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" >/dev/null

      - name: Gerar APK Release para distribuição direta
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/capital-do-trem-app-signing.jks" \
            -Pandroid.injected.signing.store.password="$APP_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APP_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$APP_KEY_PASSWORD"

      - name: Verificar assinatura do APK direto
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee capital-do-trem-apk-certificate.txt
          sha256sum "$APK" | tee capital-do-trem-apk.sha256

      - name: Gerar Android App Bundle assinado para Google Play
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/capital-do-trem-play-upload.jks" \
            -Pandroid.injected.signing.store.password="$UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$UPLOAD_KEY_PASSWORD"

      - name: Verificar assinatura e integridade do AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/aab-signature-check.txt
          grep -q "jar verified" /tmp/aab-signature-check.txt
          sha256sum "$AAB" | tee capital-do-trem-aab.sha256

      - name: Publicar artefatos assinados para conferência
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-android-production-signed
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
            capital-do-trem-apk.sha256
            capital-do-trem-aab.sha256
            capital-do-trem-apk-certificate.txt
          if-no-files-found: error
          retention-days: 7
