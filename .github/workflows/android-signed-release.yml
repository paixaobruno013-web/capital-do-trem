name: Publicar CAPITAL DO TREM — APK Android direto

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versão do aplicativo (ex.: 1.0.1)"
        required: true
        default: "1.0.1"
        type: string
      release_version_code:
        description: "Código numérico superior ao da versão instalada"
        required: true
        default: "1000001"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/release-triggers/android-v1.0.1"

permissions:
  contents: write

concurrency:
  group: capital-do-trem-android-direct-release
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Gerar e publicar APK Android assinado
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validar presença das credenciais de assinatura
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APP_KEYSTORE_BASE64 APP_STORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta configurar um segredo protegido de assinatura Android. Consulte as instruções do repositório."
              exit 1
            fi
          done

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar versão da publicação
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="$RELEASE_VERSION_INPUT"
          else
            RELEASE_VERSION="$(tr -d '[:space:]' < .github/release-triggers/android-v1.0.1)"
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Informe uma versão válida, como 1.0.0."
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_VERSION_CODE="${{ inputs.release_version_code }}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
            PATCH="${PATCH%%-*}"
            RELEASE_VERSION_CODE="$((MAJOR * 1000000 + MINOR * 1000 + PATCH))"
          fi
          if [[ ! "$RELEASE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || (( RELEASE_VERSION_CODE > 2100000000 )); then
            echo "::error::Código de versão Android inválido."
            exit 1
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$RELEASE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar aplicativo e projeto Android
        run: |
          npm install --no-audit --no-fund
          node scripts/check-music-experience.mjs
          node scripts/check-music-upload-stability.mjs
          node scripts/check-view-once-chat.mjs
          node scripts/check-offline-experience.mjs
          node scripts/check-screen-organization.mjs
          node scripts/check-chat-controls.mjs
          node scripts/check-chat-attachments.mjs
          npm run build:web
          npx cap add android

      - name: Aplicar versionName e versionCode no Android
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_VERSION_CODE: ${{ env.RELEASE_VERSION_CODE }}
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]+)[0-9]+$/\\1${RELEASE_VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]+)[\"'][^\"']*[\"']$/\\1\"${RELEASE_VERSION}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Preparar ícones com a arte oficial do Capital do Trem
        run: |
          set -euo pipefail
          mkdir -p assets
          python -m pip install --quiet Pillow
          python scripts/prepare-app-icons.py assets/apple-touch-icon.png assets/pwa-icon-512.png assets/capital-do-trem-logo.jpg assets
          mkdir -p www/assets
          cp assets/pwa-icon-192.png assets/pwa-icon-512.png www/assets/
          npx --yes @capacitor/assets@3.0.0 generate --android --assetPath assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
          python - <<'PY'
          from PIL import Image
          expected = {'assets/icon-only.png': (1024, 1024), 'assets/pwa-icon-192.png': (192, 192), 'assets/pwa-icon-512.png': (512, 512), 'assets/icon-foreground.png': (820, 820)}
          for path, size in expected.items():
              with Image.open(path) as image:
                  if image.size != size:
                      raise SystemExit(f'Ícone inválido: {path} tem {image.size}, esperado {size}')
          print('Ícones oficiais Android/PWA validados em todas as resoluções.')
          PY

      - name: Sincronizar Capacitor e preparar mídia
        run: |
          npx cap sync android
          python3 scripts/configure-android-media.py android

      - name: Restaurar chave de assinatura em diretório temporário protegido
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE_FILE="$RUNNER_TEMP/capital-do-trem-app-signing.jks"
          if ! printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"; then
            echo "::error::O segredo do arquivo de assinatura não está em Base64 válido. Não gere outra chave; confira o conteúdo do segredo ANDROID_APP_SIGNING_KEYSTORE_BASE64."
            exit 1
          fi
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::O arquivo de assinatura restaurado está vazio. Confira o segredo ANDROID_APP_SIGNING_KEYSTORE_BASE64."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$APP_STORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
            echo "::error::O arquivo foi restaurado, mas a senha de armazenamento não foi aceita. Confira ANDROID_APP_SIGNING_STORE_PASSWORD. Nenhuma senha foi exibida."
            exit 1
          fi
          if ! grep -Fq "$APP_KEY_ALIAS" "$RUNNER_TEMP/keystore-list.txt"; then
            echo "::error::A senha de armazenamento foi aceita, mas o alias configurado não existe. Alias(s) presentes no arquivo:"
            awk -F, '/PrivateKeyEntry|keyEntry/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1}' "$RUNNER_TEMP/keystore-list.txt"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$APP_STORE_PASSWORD" -alias "$APP_KEY_ALIAS" >/dev/null
          STORE_TYPE="$(awk -F': ' '/Keystore type/ {print $2; exit}' "$RUNNER_TEMP/keystore-list.txt")"
          cat > "$RUNNER_TEMP/VerifySigningKey.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          public class VerifySigningKey {
            public static void main(String[] args) throws Exception {
              KeyStore store = KeyStore.getInstance(args[1]);
              try (FileInputStream input = new FileInputStream(args[0])) {
                store.load(input, System.getenv("APP_STORE_PASSWORD").toCharArray());
              }
              Key key = store.getKey(System.getenv("APP_KEY_ALIAS"), System.getenv("APP_KEY_PASSWORD").toCharArray());
              if (!(key instanceof java.security.PrivateKey)) {
                throw new IllegalStateException("A entrada não contém uma chave privada válida.");
              }
              System.out.println("Senha da chave privada validada.");
            }
          }
          JAVA
          javac "$RUNNER_TEMP/VerifySigningKey.java"
          if ! java -cp "$RUNNER_TEMP" VerifySigningKey "$KEYSTORE_FILE" "$STORE_TYPE"; then
            echo "::error::A senha da chave privada não confere. Confira ANDROID_APP_SIGNING_KEY_PASSWORD sem compartilhar a senha."
            exit 1
          fi
          echo "Arquivo, senha de armazenamento, alias e senha da chave privada validados."

      - name: Gerar APK Release assinado para distribuição direta
        working-directory: android
        shell: bash
        env:
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/capital-do-trem-app-signing.jks" \
            -Pandroid.injected.signing.store.password="$APP_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APP_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$APP_KEY_PASSWORD"

      - name: Verificar assinatura e integridade do APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee capital-do-trem-apk-certificate.txt
          sha256sum "$APK" | tee capital-do-trem-apk.sha256
          cp "$APK" "CAPITAL-DO-TREM-$RELEASE_TAG.apk"

      - name: Publicar APK para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: "CAPITAL DO TREM Android ${{ env.RELEASE_VERSION }}"
          body: |
            Lançamento Android do CAPITAL DO TREM para instalação direta.

            - APK Release assinado e verificado.
            - Distribuição fora da Google Play.
            - Download gratuito.
            - Confira o SHA-256 publicado junto ao APK.
          files: |
            CAPITAL-DO-TREM-${{ env.RELEASE_TAG }}.apk
            capital-do-trem-apk.sha256
            capital-do-trem-apk-certificate.txt
          draft: false
          prerelease: false
