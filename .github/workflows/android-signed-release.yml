name: Publicar CAPITAL DO TREM — APK Android direto

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versão do aplicativo (ex.: 1.0.0)"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: capital-do-trem-android-direct-release
  cancel-in-progress: false

jobs:
  signed-apk:
    name: Gerar e publicar APK Android assinado
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validar presença das credenciais de assinatura
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APP_KEYSTORE_BASE64 APP_STORE_PASSWORD APP_KEY_ALIAS APP_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta configurar um segredo protegido de assinatura Android. Consulte as instruções do repositório."
              exit 1
            fi
          done

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar versão da publicação
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Informe uma versão válida, como 1.0.0."
            exit 1
          fi
          echo "RELEASE_TAG=android-v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar ferramentas Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar aplicativo e projeto Android
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android

      - name: Preparar ícones com a arte oficial do Capital do Trem
        run: |
          set -euo pipefail
          mkdir -p assets
          base64 --decode assets/capital-do-trem-logo.jpg.b64 > /tmp/capital-do-trem-logo.jpg
          python -m pip install --quiet Pillow
          python scripts/prepare-app-icons.py /tmp/capital-do-trem-logo.jpg assets
          mkdir -p www/assets
          cp assets/pwa-icon-192.png assets/pwa-icon-512.png www/assets/
          npx --yes @capacitor/assets@3.0.0 generate --android --assetPath assets --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Sincronizar Capacitor e preparar mídia
        run: |
          npx cap sync android
          python3 scripts/configure-android-media.py android

      - name: Restaurar chave de assinatura em diretório temporário protegido
        shell: bash
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/capital-do-trem-app-signing.jks"
          test -s "$RUNNER_TEMP/capital-do-trem-app-signing.jks"
          keytool -list -keystore "$RUNNER_TEMP/capital-do-trem-app-signing.jks" -storepass "$APP_STORE_PASSWORD" -alias "$APP_KEY_ALIAS" >/dev/null

      - name: Gerar APK Release assinado para distribuição direta
        working-directory: android
        shell: bash
        env:
          APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/capital-do-trem-app-signing.jks" \
            -Pandroid.injected.signing.store.password="$APP_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APP_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$APP_KEY_PASSWORD"

      - name: Verificar assinatura e integridade do APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee capital-do-trem-apk-certificate.txt
          sha256sum "$APK" | tee capital-do-trem-apk.sha256
          cp "$APK" "CAPITAL-DO-TREM-$RELEASE_TAG.apk"

      - name: Publicar APK para download direto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "CAPITAL DO TREM Android ${{ inputs.release_version }}"
          body: |
            Lançamento Android do CAPITAL DO TREM para instalação direta.

            - APK Release assinado e verificado.
            - Distribuição fora da Google Play.
            - Download gratuito.
            - Confira o SHA-256 publicado junto ao APK.
          files: |
            CAPITAL-DO-TREM-${{ env.RELEASE_TAG }}.apk
            capital-do-trem-apk.sha256
            capital-do-trem-apk-certificate.txt
          draft: false
          prerelease: false
