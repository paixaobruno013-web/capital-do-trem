name: Preparar iOS — Capital do Trem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline.html'
      - 'manifest.webmanifest'
      - 'conta.html'
      - 'admin.html'
      - 'privacidade.html'
      - 'bate-papo.html'
      - 'chat-enhancements.js'
      - 'avatar.html'
      - 'mensagens.html'
      - 'diagnostico.html'
      - 'marca.svg'
      - 'sw.js'
      - 'update.js'
      - 'supabase/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Gerar aplicativo para simulador iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: npm run build:web

      - name: Criar projeto iOS Capacitor
        run: npx cap add ios

      - name: Configurar Python para gerar os ícones
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar o ícone oficial do Capital do Trem
        env:
          PROFILE_ICON_URL: https://zmjxkfjzrbbxyvgkwirv.supabase.co/storage/v1/object/public/capital-do-trem-media/31937786-c321-445f-ae1c-de018eca95c8/avatar/b338f7a8-8964-4063-9086-64a9bd603f4f.jpg
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$PROFILE_ICON_URL" --output /tmp/capital-do-trem-profile.jpg
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare-app-icons.py /tmp/capital-do-trem-profile.jpg assets
          npx --yes @capacitor/assets@3.0.0 generate --ios --assetPath assets --iconBackgroundColor '#080809' --iconBackgroundColorDark '#080809'

      - name: Sincronizar projeto iOS
        run: npx cap sync ios

      - name: Conferir versão do Xcode e simuladores
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          test -d ios/App/App.xcodeproj

      - name: Compilar para simulador sem assinatura
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar aplicativo do simulador
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Debug-iphonesimulator/App.app \
            Capital-do-Trem-iOS-Simulator.zip

      - name: Publicar artefato para testes técnicos
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-ios-simulator
          path: Capital-do-Trem-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
