name: Preparar iOS — Capital do Trem

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'youtube-feed.js'
      - 'event-social-composer.js'
      - 'home-story-composer.js'
      - 'offline.html'
      - 'manifest.webmanifest'
      - 'conta.html'
      - 'admin.html'
      - 'privacidade.html'
      - 'bate-papo.html'
      - 'chat-enhancements.js'
      - 'avatar.html'
      - 'mensagens.html'
      - 'diagnostico.html'
      - 'marca.svg'
      - 'sw.js'
      - 'update.js'
      - 'supabase/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
      - 'admin-media.js'
      - 'emoji-picker.js'
      - 'stories-ui.js'
      - 'admin-stories.js'
      - 'account-stories.js'
      - 'supabase-config.js'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'youtube-feed.js'
      - 'event-social-composer.js'
      - 'home-story-composer.js'
      - 'offline.html'
      - 'manifest.webmanifest'
      - 'conta.html'
      - 'admin.html'
      - 'privacidade.html'
      - 'bate-papo.html'
      - 'chat-enhancements.js'
      - 'avatar.html'
      - 'mensagens.html'
      - 'diagnostico.html'
      - 'marca.svg'
      - 'sw.js'
      - 'update.js'
      - 'supabase/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
      - 'admin-media.js'
      - 'emoji-picker.js'
      - 'stories-ui.js'
      - 'admin-stories.js'
      - 'account-stories.js'
      - 'supabase-config.js'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios-simulator:
    name: Gerar aplicativo para simulador iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Preparar arquivos web
        run: npm run build:web

      - name: Criar projeto iOS Capacitor
        run: npx cap add ios

      - name: Configurar permissões nativas de privacidade do iOS
        run: python3 scripts/prepare-ios-info.py ios/App/App/Info.plist

      - name: Configurar Python para gerar os ícones
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar o ícone oficial da marca Capital do Trem
        env:
          PROFILE_ICON_URL: https://zmjxkfjzrbbxyvgkwirv.supabase.co/storage/v1/object/public/capital-do-trem-media/31937786-c321-445f-ae1c-de018eca95c8/branding/official-logo-d2daa073-35ba-456e-90ee-f156c9a1d450.jpg
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$PROFILE_ICON_URL" --output /tmp/capital-do-trem-profile.jpg
          python3 -m pip install --quiet Pillow
          python3 scripts/prepare-app-icons.py /tmp/capital-do-trem-profile.jpg assets
          npx --yes @capacitor/assets@3.0.0 generate --ios --assetPath assets --iconBackgroundColor '#080809' --iconBackgroundColorDark '#080809'

      - name: Sincronizar projeto iOS
        run: npx cap sync ios

      - name: Validar versão mínima do iOS suportada pelo Capacitor 8
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -showBuildSettings > /tmp/cdt-ios-settings.txt
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0' /tmp/cdt-ios-settings.txt

      - name: Conferir versão do Xcode e simuladores
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          test -d ios/App/App.xcodeproj

      - name: Compilar para simulador sem assinatura
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar aplicativo do simulador
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/Build/Products/Debug-iphonesimulator/App.app \
            Capital-do-Trem-iOS-Simulator.zip

      - name: Publicar artefato para testes técnicos do simulador
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-ios-simulator
          path: Capital-do-Trem-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Compilar aplicativo iOS para dispositivo (sem assinatura)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/device-build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empacotar aplicativo iOS para dispositivo
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/device-build/Build/Products/Release-iphoneos/App.app \
            Capital-do-Trem-iOS-Device-Unsigned.zip

      - name: Publicar artefato iOS para dispositivo (sem assinatura)
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-ios-device-unsigned
          path: Capital-do-Trem-iOS-Device-Unsigned.zip
          if-no-files-found: error
          retention-days: 14
