name: Auditoria de segurança do Capital do Trem

on:
  push:
    branches: [main, ia-camera-comandos-rapidos]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Gerar arquivos web
        run: npm run build:web
      - name: Executar auditoria estática de segurança
        run: node scripts/check-security-baseline.mjs
