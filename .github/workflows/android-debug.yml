name: Gerar APK de teste do Capital do Trem

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'conta.html'
      - 'admin.html'
      - 'privacidade.html'
      - 'bate-papo.html'
      - 'avatar.html'
      - 'mensagens.html'
      - 'diagnostico.html'
      - 'marca.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'update.js'
      - 'supabase/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compilar APK Android de teste
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências web e Capacitor
        run: npm install

      - name: Preparar arquivos web
        run: npm run build:web

      - name: Criar projeto Android
        run: npx cap add android

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
