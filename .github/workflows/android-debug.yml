name: Gerar APK de teste do Capital do Trem

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'event-social-composer.js'
      - 'home-story-composer.js'
      - 'offline.html'
      - 'conta.html'
      - 'admin.html'
      - 'privacidade.html'
      - 'bate-papo.html'
      - 'chat-enhancements.js'
      - 'stories-ui.js'
      - 'admin-stories.js'
      - 'account-stories.js'
      - 'avatar.html'
      - 'mensagens.html'
      - 'diagnostico.html'
      - 'marca.svg'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'update.js'
      - 'supabase/**'
      - 'scripts/**'
      - 'assets/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compilar APK Android de teste
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar plataforma Android 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências web e Capacitor
        run: npm install

      - name: Preparar arquivos web
        run: npm run build:web

      - name: Criar projeto Android
        run: npx cap add android

      - name: Preparar ícones com a imagem oficial do perfil
        env:
          PROFILE_ICON_URL: https://zmjxkfjzrbbxyvgkwirv.supabase.co/storage/v1/object/public/capital-do-trem-media/31937786-c321-445f-ae1c-de018eca95c8/avatar/b338f7a8-8964-4063-9086-64a9bd603f4f.jpg
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$PROFILE_ICON_URL" --output /tmp/capital-do-trem-profile.jpg
          python -m pip install --quiet Pillow
          python scripts/prepare-app-icons.py /tmp/capital-do-trem-profile.jpg assets
          npx --yes @capacitor/assets@3.0.0 generate --android --assetPath assets --iconBackgroundColor '#080809' --iconBackgroundColorDark '#080809'

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Permitir áudio automático no WebView Android
        run: python scripts/configure-android-media.py android

      - name: Compilar APK de teste
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Registrar diagnóstico da compilação
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo '## Diagnóstico automático — APK Android'
            echo "- Resultado da compilação: **${JOB_STATUS}**"
            echo "- Branch: \`${BRANCH_NAME}\`"
            echo "- Commit: \`${COMMIT_SHA}\`"
            echo "- Execução: ${RUN_URL}"
            if [ "$JOB_STATUS" = success ]; then
              echo '- APK de teste: procure o artefato \`capital-do-trem-android-debug\` nesta execução.'
            else
              echo '- Ação necessária: abrir a execução, localizar a primeira etapa com falha e revisar os logs antes de corrigir.'
            fi
            echo '- Segurança: esta rotina não publica em produção nem altera arquivos visuais aprovados.'
          } >> "$GITHUB_STEP_SUMMARY"
