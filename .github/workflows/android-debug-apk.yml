name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'youtube-feed.js'
      - 'rede.js'
      - 'supabase/auth.js'
      - 'index.html'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - 'assets/**'
      - 'home-story-composer.js'
      - 'stories-ui.js'
      - 'account-stories.js'
      - 'admin-stories.js'
      - 'event-social-composer.js'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web application
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Preparar ícones com a imagem oficial do perfil
        env:
          PROFILE_ICON_URL: https://zmjxkfjzrbbxyvgkwirv.supabase.co/storage/v1/object/public/capital-do-trem-media/31937786-c321-445f-ae1c-de018eca95c8/avatar/b338f7a8-8964-4063-9086-64a9bd603f4f.jpg
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 "$PROFILE_ICON_URL" --output /tmp/capital-do-trem-profile.jpg
          python -m pip install --quiet Pillow
          python scripts/prepare-app-icons.py /tmp/capital-do-trem-profile.jpg assets
          npx --yes @capacitor/assets@3.0.0 generate --android --assetPath assets --iconBackgroundColor '#080809' --iconBackgroundColorDark '#080809'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Permitir áudio automático no WebView Android
        run: python3 scripts/configure-android-media.py android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: capital-do-trem-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
